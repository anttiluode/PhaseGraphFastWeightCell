name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m phasegraph.benchmark --steps 2 --seeds 41 --batch-size 4 --eval-count 8 --horizons 1 4 --output runs/smoke
      - run: python examples/streaming_demo.py --rewrites 4
