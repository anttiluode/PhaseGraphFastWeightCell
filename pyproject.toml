[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phasegraph-fastweight"
version = "0.1.0"
description = "Experimental byte-packed phase-graph recurrent working memory"
requires-python = ">=3.10"
dependencies = ["torch>=2.5"]
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=8"]
plots = ["matplotlib>=3.8"]

[project.scripts]
phasegraph-benchmark = "phasegraph.benchmark:main"

[tool.setuptools.packages.find]
include = ["phasegraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

